# Serves the built SPA and proxies /api to the FastAPI container (same origin → cookie auth just works).

# Real visitor IP behind the Cloudflare Tunnel. cloudflared connects from inside the Docker
# network, so trust only private (container) addresses and take the visitor's IP from
# CF-Connecting-IP. $remote_addr (access log, rate limit, X-Real-IP / X-Forwarded-For to the
# API, audit log) then holds the real IP. Safe because web publishes no host port: only
# containers on this network can reach nginx, so nobody outside can forge the header.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 210m;   # MAX_UPLOAD_MB (200) + multipart overhead
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    location ~ ^/api/v1/auth/(login|forgot-password|reset-password) {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params_epm;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params_epm;
        proxy_request_buffering off;   # stream large uploads
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
